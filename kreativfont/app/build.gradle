plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.kreativ.fontboard'
    compileSdk 36

    defaultConfig {
        // Existing Google Play package. The recovered legacy keystore must be verified before
        // creating a signed v2 release for this listing.
        applicationId 'com.kreativ.fontapp'
        minSdk 26
        targetSdk 36
        // Legacy production is 2.0.0 / version code 200.
        versionCode 207
        versionName '2.4.0'
        testInstrumentationRunner project.hasProperty('kreativfontOptimizedChecks')
                ? 'com.kreativ.fontboard.OptimizedReleaseRunner'
                : 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    testBuildType 'release'

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    constraints {
        implementation('androidx.fragment:fragment:1.9.1') {
            because 'Replace the outdated Fragment 1.3.6 pulled in through Glide.'
        }
    }
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'org.jsoup:jsoup:1.21.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    // AndroidX Test references these annotations; resolve them for its R8 pass.
    // Test-only: this dependency is not packaged in the production app.
    androidTestImplementation 'com.google.errorprone:error_prone_annotations:2.47.0'
}
