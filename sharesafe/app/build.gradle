plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('KREATIV_SHARESAFE_KEYSTORE')
def releaseKeystorePassword = System.getenv('KREATIV_SHARESAFE_KEYSTORE_PASSWORD')

android {
    namespace 'com.kreativ.sharesafe'
    compileSdk 36

    flavorDimensions += "store"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.kreativ.sharesafe'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (releaseKeystorePath != null && releaseKeystorePassword != null) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias 'sharesafe-release'
                keyPassword releaseKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    // Store-specific builds keep future billing integrations isolated. All variants
    // intentionally retain the same application ID and release signing identity.
    productFlavors {
        play {
            dimension "store"
        }
        samsung {
            dimension "store"
        }
        amazon {
            dimension "store"
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
