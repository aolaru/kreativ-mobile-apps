plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('KREATIV_SHARESAFE_KEYSTORE')
def releaseKeystorePassword = System.getenv('KREATIV_SHARESAFE_KEYSTORE_PASSWORD')

// Test-only keep rules and the isolated package must never replace release outputs.
if (project.hasProperty('sharesafeIsolatedTest')) {
    layout.buildDirectory.set(file('build/isolated-r8'))
}

android {
    namespace 'com.kreativ.sharesafe'
    compileSdk 36

    flavorDimensions += "store"

    buildFeatures {
        buildConfig true
    }

    // Opt in to testing the optimised release without changing normal debug tests.
    testBuildType = project.findProperty('sharesafeTestBuildType') ?: 'debug'

    // Release instrumentation tests use public UI and intents, so R8 can freely
    // optimise internal classes. Keep the deeper white-box suite for debug.
    if (testBuildType == 'release') {
        sourceSets {
            androidTest.java.setSrcDirs(['src/androidTestOptimized/java'])
            androidTestPlay.java.setSrcDirs([])
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.kreativ.sharesafe'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.2.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testProguardFiles 'test-proguard-rules.pro'
    }

    signingConfigs {
        release {
            if (releaseKeystorePath != null && releaseKeystorePassword != null) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias 'sharesafe-release'
                keyPassword releaseKeystorePassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            signingConfig signingConfigs.release
            // An isolated test package can coexist with the Play installation.
            if (project.hasProperty('sharesafeIsolatedTest')) {
                applicationIdSuffix '.r8test'
                proguardFiles 'isolated-test-proguard-rules.pro'
            }
            // Reduce release DEX size and enable the code optimisation monitored by Play.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    // Store-specific builds keep future billing integrations isolated. All variants
    // intentionally retain the same application ID and release signing identity.
    productFlavors {
        play {
            dimension "store"
            buildConfigField 'boolean', 'PRO_AVAILABLE', 'true'
        }
        samsung {
            dimension "store"
            buildConfigField 'boolean', 'PRO_AVAILABLE', 'false'
        }
        amazon {
            dimension "store"
            buildConfigField 'boolean', 'PRO_AVAILABLE', 'false'
        }
    }
}

// Kotlin 1.8 bundles the JDK 7/8 extensions into kotlin-stdlib. Some legacy
// AndroidX transitive dependencies still request the separate 1.6 artifacts.
configurations.configureEach {
    // Do not alter Gradle's host-side UTP tool classpath: its JDK8 artifact supplies
    // a newer stdlib needed by the APK installer (EnumEntriesKt).
    if (!name.startsWith('_internal-unified-test-platform')) {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    playImplementation 'com.android.billingclient:billing:9.1.0'
    playImplementation 'androidx.work:work-runtime:2.10.1'
    // Bundled model: Face Assist must work without a model download.
    playImplementation 'com.google.mlkit:face-detection:16.1.7'
    constraints {
        playImplementation('androidx.fragment:fragment:1.9.1') {
            because 'Google SDKs request obsolete Fragment versions flagged by Play Console'
        }
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
