  <text x="185" y="195" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#315eaa">SAMPLE</text>
  <text x="150" y="320" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#1e2935">Project notes</text>
  <text x="150" y="375" font-family="Arial, sans-serif" font-size="30" fill="#5b6878">A fictional document for PaperBuild screenshots.</text>
  <line x1="150" y1="440" x2="1050" y2="440" stroke="#dce3ef" stroke-width="4"/>
  <g font-family="Arial, sans-serif" fill="#1e2935">
    <text x="150" y="530" font-size="34" font-weight="700">1. Collect pages</text>
    <text x="150" y="580" font-size="28" fill="#5b6878">Scan a page or select images from your device.</text>
    <text x="150" y="700" font-size="34" font-weight="700">2. Put them in order</text>
    <text x="150" y="750" font-size="28" fill="#5b6878">Rotate, reorder, or remove a page before export.</text>
    <text x="150" y="870" font-size="34" font-weight="700">3. Build a PDF</text>
    <text x="150" y="920" font-size="28" fill="#5b6878">Choose your page size and document treatment.</text>
  </g>
  <rect x="150" y="1040" width="900" height="260" rx="16" fill="#eaf1ff"/>
