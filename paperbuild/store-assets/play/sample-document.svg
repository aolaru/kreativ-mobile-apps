<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#f7f8fc"/>
  <rect x="90" y="90" width="1020" height="1420" rx="18" fill="#ffffff" stroke="#dce3ef" stroke-width="5"/>
