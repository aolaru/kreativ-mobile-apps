plugins {
    id 'com.android.application'
}

import java.util.Properties

def releaseSigningFile = rootProject.file('release-signing.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def releaseStoreFile = releaseSigning['storeFile'] ?: System.getenv('PAPERBUILD_STORE_FILE')
def releaseStorePassword = releaseSigning['storePassword'] ?: System.getenv('PAPERBUILD_STORE_PASSWORD')
def releaseKeyAlias = releaseSigning['keyAlias'] ?: System.getenv('PAPERBUILD_KEY_ALIAS')
def releaseKeyPassword = releaseSigning['keyPassword'] ?: System.getenv('PAPERBUILD_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def isolatedOptimizationTest = project.hasProperty('paperbuildIsolatedTest')
if (isolatedOptimizationTest) {
    // Never overwrite production artifacts with an isolated, debug-key-signed test APK.
    layout.buildDirectory.set(file('build/isolated-r8'))
}

android {
    namespace 'com.kreativ.paperbuild'
    compileSdk 36
    testBuildType isolatedOptimizationTest ? 'release' : 'qa'
    if (isolatedOptimizationTest) {
        sourceSets.androidTest.java.setSrcDirs(['src/androidTestOptimized/java'])
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.kreativ.paperbuild'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.2.0'
        testInstrumentationRunner isolatedOptimizationTest
                ? 'com.kreativ.paperbuild.OptimizedReleaseRunner'
                : 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        qa {
            initWith debug
            // A fresh suffix lets regression runs preserve an existing owner's QA data.
            applicationIdSuffix project.findProperty('paperbuildQaApplicationIdSuffix') ?: '.qa'
            resValue 'string', 'app_name', 'PaperBuild QA'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (isolatedOptimizationTest) {
                applicationIdSuffix '.r8test'
                signingConfig signingConfigs.debug
            } else if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    constraints {
        implementation('androidx.fragment:fragment:1.9.1') {
            because 'Replace the outdated Fragment 1.1.0 pulled in through Play Billing/Play services.'
        }
    }
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    testImplementation 'junit:junit:4.13.2'
    if (!isolatedOptimizationTest) {
        androidTestImplementation 'androidx.test.ext:junit:1.2.1'
        androidTestImplementation 'androidx.test:runner:1.6.2'
        androidTestImplementation 'androidx.test:core:1.6.1'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    }
}
