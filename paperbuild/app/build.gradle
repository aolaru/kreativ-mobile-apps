plugins {
    id 'com.android.application'
}

import java.util.Properties

def releaseSigningFile = rootProject.file('release-signing.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def releaseStoreFile = releaseSigning['storeFile'] ?: System.getenv('PAPERBUILD_STORE_FILE')
def releaseStorePassword = releaseSigning['storePassword'] ?: System.getenv('PAPERBUILD_STORE_PASSWORD')
def releaseKeyAlias = releaseSigning['keyAlias'] ?: System.getenv('PAPERBUILD_KEY_ALIAS')
def releaseKeyPassword = releaseSigning['keyPassword'] ?: System.getenv('PAPERBUILD_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.kreativ.paperbuild'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.kreativ.paperbuild'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
