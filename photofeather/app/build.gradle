plugins { id 'com.android.application' }
// Production credentials are supplied externally; never commit keystores or passwords.
def releaseStore = System.getenv('PHOTOFEATHER_KEYSTORE')
def releaseStorePassword = System.getenv('PHOTOFEATHER_STORE_PASSWORD')
def releaseAlias = System.getenv('PHOTOFEATHER_KEY_ALIAS')
def releaseKeyPassword = System.getenv('PHOTOFEATHER_KEY_PASSWORD')
def qaRelease = project.hasProperty('photoFeatherQaRelease')
android {
    namespace 'com.kreativ.photofeather'
    compileSdk 36
    defaultConfig {
        applicationId 'com.kreativ.photofeather'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    testBuildType(project.findProperty('photoFeatherTestBuildType') ?: 'debug')
    signingConfigs {
        release {
            if (releaseStore && releaseStorePassword && releaseAlias && releaseKeyPassword) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    sourceSets {
        androidTest {
            if (project.findProperty('photoFeatherTestBuildType') == 'release') {
                java.setSrcDirs(['src/releaseTest/java'])
            } else if (project.hasProperty('photoFeatherAccessibilityTest')) {
                java.setSrcDirs(['src/accessibilityTest/java'])
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix(project.findProperty('photoFeatherTestSuffix') ?: '.debug') }
        release {
            minifyEnabled false
            if (qaRelease) {
                // Installable, non-debuggable release-code check; never a production signing key.
                applicationIdSuffix '.releasecheck'
                signingConfig signingConfigs.debug
            } else if (releaseStore && releaseStorePassword && releaseAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':image-engine')
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
