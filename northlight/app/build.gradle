plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kreativ.northlight'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.kreativ.northlight'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
