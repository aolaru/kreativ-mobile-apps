plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('KREATIV_NORTHLIGHT_KEYSTORE')
def releaseKeystorePassword = System.getenv('KREATIV_NORTHLIGHT_KEYSTORE_PASSWORD')
def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

android {
    namespace 'com.kreativ.northlight'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                    '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.kreativ.northlight'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.2.0'
        testInstrumentationRunner 'com.kreativ.northlight.UiTestRunner'
    }

    signingConfigs {
        release {
            if (releaseKeystorePath != null && releaseKeystorePassword != null) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias 'northlight-upload'
                keyPassword releaseKeystorePassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
        }
        // Real-device store captures without replacing the installed Play app.
        storePreview {
            initWith release
            applicationIdSuffix '.preview'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

if (isReleaseTask && (releaseKeystorePath == null || releaseKeystorePassword == null)) {
    throw new GradleException('Release signing requires KREATIV_NORTHLIGHT_KEYSTORE and KREATIV_NORTHLIGHT_KEYSTORE_PASSWORD.')
}

dependencies {
    constraints {
        implementation('androidx.fragment:fragment:1.9.1') {
            because 'Replace the outdated Fragment 1.1.0 pulled in through Play Billing/Play services.'
        }
    }
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
